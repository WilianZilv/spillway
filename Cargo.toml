[package]
name = "spillway"
version = "0.1.0"
edition = "2021"
description = "RAM-first FUSE filesystem for video recordings: writes land in RAM, get parsed and load-balanced to disk destinations across a master/node cluster."

[[bin]]
name = "spillway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
fuser = "0.18"
futures = "0.3"
libc = "0.2"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
http-body-util = "0.1"
include_dir = "0.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
debug = "line-tables-only"
